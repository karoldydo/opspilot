name: pipeline

# deploy + cleanup only (no linters/tests/security yet - those come later).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: quality gates (lint, format, typecheck, unit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # throwaway boot env so the api config/joi validation passes when nx test api
    # boots the nest app; non-production values tied to a fresh e2e db (no real data).
    env:
      CI: true
      BETTER_AUTH_SECRET: 8b47068deb2f96c65512f09eba1f36ff48acd3281f8d29ad9a78e4a73fb97dec
      ENCRYPTION_KEY: /8bldWhgAaozhiMMICDRCXXJJIJYv6FLkNEMx9Meu9s=
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:3000,http://localhost:4200
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install deps
        run: npm ci

      - name: lint
        run: npx nx run-many -t lint

      - name: format check
        run: npx nx format:check --all

      # typecheck covers api + shared only; web's type-check is `nx build web` below.
      - name: typecheck
        run: npx nx run-many -t typecheck

      - name: unit tests
        run: npx nx run-many -t test --projects=api,shared,web

      # web has no typecheck target; the production build is its type-check.
      - name: build web (web type-check)
        run: npx nx build web

  deploy:
    name: build & push (multi-arch -> ghcr)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v5

      # arm64 emulation for the multi-arch build.
      - name: set up qemu
        uses: docker/setup-qemu-action@v4

      - name: set up buildx
        uses: docker/setup-buildx-action@v4

      - name: log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  cleanup:
    name: prune old ghcr versions
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # manifest-aware cleanup: preserves child manifests of kept tags + latest,
      # deletes only genuine orphans (safe for multi-arch, unlike delete-package-versions).
      - name: clean up ghcr
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: opspilot
          keep-n-tagged: 5
          delete-untagged: true
