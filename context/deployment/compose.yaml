# host artifact — NOT a repo/runtime file. upload to the synology nas at
# /volume1/docker/opspilot/compose.yaml together with a sibling .env (chmod 600,
# TUNNEL_TOKEN=..., never committed). staged here per deploy-plan.md phase 3.
#
# first run on the host:
#   cd /volume1/docker/opspilot
#   docker compose pull && docker compose up -d
#   docker compose logs -f

services:
  opspilot:
    image: ghcr.io/karoldydo/opspilot:latest
    restart: unless-stopped
    # loopback only — cloudflared reaches the app over the internal bridge,
    # nothing else on the lan should hit 8080 directly.
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      # local btrfs, never a network share. future sqlite file lives here.
      - /volume1/docker/opspilot/data:/data
    # pre-wired for later lan-discovery features (nmap/arp-scan). honored over ssh.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    healthcheck:
      # busybox wget is present in nginx:alpine; no curl needed.
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/api/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # the shared watchtower on the nas (WATCHTOWER_LABEL_ENABLE=true) watches this.
    # monitor-only: it only pushover-notifies on a new latest; update is human/agent-triggered.
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    networks:
      - internal

networks:
  # existing, manually-created external bridge on the nas (same one watchtower uses).
  # service-name dns over the bridge lets cloudflared target http://opspilot:8080.
  internal:
    external: true
