# host artifact - NOT a repo/runtime file. upload to the synology nas at
# /volume1/docker/opspilot/compose.yaml. staged here per deploy-plan.md phase 3.
# the stack does not run its own cloudflared - a shared host-mode cloudflare-tunnel
# (its own TUNNEL_TOKEN) already fronts the nas and routes opspilot.<domain> ->
# http://localhost:8080 via a cloudflare public hostname.
#
# a sibling .env IS required: the api validates BETTER_AUTH_SECRET, BETTER_AUTH_URL,
# ENCRYPTION_KEY and TRUSTED_ORIGINS at boot (apps/api/src/config/env.schema.ts) and
# fails fast if any is missing. create /volume1/docker/opspilot/.env (chmod 600);
# deploy.sh leaves the remote .env intact on redeploys.
#
# first run on the host:
#   cd /volume1/docker/opspilot
#   docker compose pull && docker compose up -d
#   docker compose logs -f

services:
  opspilot:
    image: ghcr.io/karoldydo/opspilot:latest
    restart: unless-stopped
    # loopback only - the shared host-mode cloudflare-tunnel reaches the app via
    # the host loopback (http://localhost:8080), not over a docker bridge.
    # nothing else on the lan should hit 8080 directly.
    ports:
      - '127.0.0.1:8080:8080'
    # api secrets validated at boot by joi (better-auth + encryption key + origins).
    # kept out of the repo; lives in the host-side .env (chmod 600, never committed).
    env_file:
      - .env
    # pin the sqlite path to the bind-mounted /data volume, independent of NODE_ENV.
    # without this the app falls back to ./data in the writable container layer and
    # loses the db on every container recreation (watchtower/redeploy).
    environment:
      - DATABASE_PATH=/data/opspilot.db
    volumes:
      # local btrfs, never a network share. future sqlite file lives here.
      - /volume1/docker/opspilot/data:/data
    # pre-wired for later lan-discovery features (nmap/arp-scan). honored over ssh.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    healthcheck:
      # busybox wget is present in nginx:alpine; no curl needed.
      # /api/ has no route (404); /api/health returns 200 {status:ok,db:up}.
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # the shared watchtower on the nas (WATCHTOWER_LABEL_ENABLE=true) watches this.
    # monitor-only: it only pushover-notifies on a new latest; update is human/agent-triggered.
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    networks:
      - internal

networks:
  # existing, manually-created external bridge shared by the nas fleet. the tunnel
  # is host-mode and does NOT use this bridge (it reaches the app via loopback);
  # membership is kept for future container-to-container links (db, sidecars).
  internal:
    external: true
