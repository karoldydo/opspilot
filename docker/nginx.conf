# full nginx config for the opspilot runtime image.
# serves the angular spa and reverse-proxies /api to the local nestjs process.

user  nginx;
worker_processes  auto;
error_log  /dev/fd/2 warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/fd/1;
    sendfile    on;
    tcp_nopush  on;

    # websocket / sse upgrade mapping (lives in http context).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen      8080;
        server_name _;
        root        /usr/share/nginx/html;

        # long cache on content-hashed assets (angular outputHashing=all).
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }

        # api reverse proxy. proxy_pass has no uri part so the /api prefix is preserved.
        location /api/ {
            proxy_pass http://127.0.0.1:3000;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # sse-safe from day one: no buffering, no caching, long timeouts.
            proxy_buffering            off;
            proxy_cache                off;
            proxy_read_timeout         3600s;
            proxy_send_timeout         3600s;
            chunked_transfer_encoding  on;

            # websocket fallback.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # do not override X-Accel-Buffering; let the app emit `X-Accel-Buffering: no`.
        }

        # angular client-side routing: fall back to index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
