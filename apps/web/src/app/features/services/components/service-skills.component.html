<div class="flex flex-col items-end gap-1">
  <div class="flex flex-wrap justify-end gap-1.5">
    @for (skill of visibleSkills(); track skill.id) {
      <button
        type="button"
        [disabled]="entry().pending !== null"
        (click)="openRun(skill)"
        hlmBtn
        size="sm"
        variant="outline"
      >
        {{ entry().pending === skill.id ? 'running…' : skill.name }}
      </button>
    }
  </div>

  @if (entry().error) {
    <p class="text-op-danger-text text-xs" role="alert">{{ entry().error }}</p>
  } @else if (entry().result; as result) {
    <p class="text-xs {{ result.status === 'succeeded' ? 'text-op-success-text' : 'text-op-danger-text' }}">
      {{ result.message }}
    </p>
  }
</div>
