<hlm-dialog-header>
  <h2 class="text-base font-bold" hlmDialogTitle>rename service</h2>
  <p class="text-op-mute text-[12.5px]" hlmDialogDescription>
    change the display name for {{ containerName }}. the container identity stays the same.
  </p>
</hlm-dialog-header>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="flex flex-col gap-4 py-2">
    <div class="flex flex-col gap-2">
      <label class="text-op-body text-xs" for="name" hlmLabel>name</label>
      <input class="bg-op-surface-soft" id="name" type="text" formControlName="name" hlmInput placeholder="web-01" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
      <p class="text-op-danger-text text-sm">{{ form.controls.name.getError('zod') }}</p>
      }
    </div>

    @if (errorMessage()) {
    <p class="text-op-danger-text text-sm" role="alert">{{ errorMessage() }}</p>
    }
  </div>

  <hlm-dialog-footer>
    <button type="button" (click)="cancel()" hlmBtn variant="outline">cancel</button>
    <button type="submit" [disabled]="submitting()" hlmBtn>{{ submitting() ? 'saving…' : 'save' }}</button>
  </hlm-dialog-footer>
</form>
